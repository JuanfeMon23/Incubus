[project]
name = "incubus-backend"
version = "0.1.0"
description = "Incubus: workflow del laboratorio (modulo Atencion)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "leo-sdk[settings]",
    "pydantic-settings>=2.15.0",
    "python-socketio>=5.17.0",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
leo-sdk = { git = "https://github.com/JuanfeMon23/Leo.git", subdirectory = "sdk/python", tag = "v0.8.0" }

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]
